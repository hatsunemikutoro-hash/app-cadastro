<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Perfil</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/edit.css') }}">
</head>
<body>

<div class="form-container">
    <h2>Editar Perfil</h2>
    <form action="/edit" method="POST">
        <input type="hidden" name="id" value="{{ usuario.id }}">

        <div class="input-group">
            <label>Nome Completo</label>
            <input type="text" name="nome" value="{{ usuario.nome }}" required>
        </div>

        <div class="input-group">
            <label>E-mail</label>
            <input type="email" name="email" value="{{ usuario.email }}" required>
        </div>

        <div class="input-group">
            <label>CPF</label>
            <input type="text" name="cpf" value="{{ usuario.cpf }}">
        </div>

        <div class="input-group">
            <label>Endereço</label>
            <input type="text" name="endereco" value="{{ usuario.endereco }}">
        </div>

        <div style="display: flex; gap: 10px;">
            <div class="input-group" style="flex: 1;">
                <label>Cidade</label>
                <input type="text" name="cidade" value="{{ usuario.cidade }}">
            </div>
            <div class="input-group" style="flex: 0.3;">
                <label>Estado (UF)</label>
                <input type="text" name="estado" value="{{ usuario.estado }}" maxlength="2">
            </div>
        </div>

        <button type="submit" class="btn-submit">Confirmar Alterações</button>
        <a href="{{ url_for('perfil') }}" class="link-cancel">Cancelar e voltar</a>
    </form>
</div>

</body>
</html>
